apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: atlas-demo
servers: 1
# Pinned so a k3d upgrade cannot silently
# move the lab to a new Kubernetes minor. Bump deliberately.
image: rancher/k3s:v1.35.5-k3s1
agents: 2
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer
registries:
  create:
    name: atlas-demo-registry
    # Loopback only: the registry is unauthenticated, so do not expose it on
    # the LAN. Host-side pushes use localhost:5001; in-cluster pulls go over
    # the k3d docker network as atlas-demo-registry:5001.
    host: "127.0.0.1"
    hostPort: "5001"
options:
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
  k3s:
    extraArgs:
      - arg: --disable=helm-controller
        nodeFilters:
          - server:*
