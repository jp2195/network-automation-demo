crds:
  install: true
  keep: true

singleNamespace: false

workflow:
  serviceAccount:
    create: true
    name: argo-workflow
  rbac:
    create: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Every alert fans out into several workflows (enrich-notify,
  # ai-analyze, incident-collect, remediate), and nothing cleaned up
  # their pods: a long scenario session left 600+ Completed pods, and
  # Alloy, which tails every pod's log, pegged several cores and went
  # unready. Delete pods 10m after they finish (long enough for
  # `make last-notify` and the UI's log view mid-demo) and expire the
  # Workflow objects after 2h (24h when they failed). A template's own
  # ttlStrategy (cron-drift-audit) still wins.
  workflowDefaults:
    spec:
      podGC:
        strategy: OnPodCompletion
        deleteDelayDuration: 10m
      ttlStrategy:
        secondsAfterSuccess: 7200
        secondsAfterFailure: 86400
  metricsConfig:
    enabled: true
  serviceMonitor:
    enabled: true

server:
  enabled: true
  replicas: 1
  authModes:
    - server
  extraArgs:
    - --auth-mode=server
    - --secure=false
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
    hosts:
      - workflows.127-0-0-1.nip.io
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: argo-workflows-tls
        hosts:
          - workflows.127-0-0-1.nip.io
