manager:
  replicaCount: 1
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      memory: 256Mi

# `deployment` sits directly under globalConfig. (It used to be nested under
# a non-existent `config:` key, so these requests never applied and every
# launcher requested the chart's 200m/512Mi — 6Gi for the 12 nodes.)
globalConfig:
  enabled: true
  deployment:
    resourcesDefault:
      requests:
        cpu: 100m
        memory: 256Mi
    privilegedLauncher: true

ui:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: true
    ingressClass: traefik
    host: clabernetes.127-0-0-1.nip.io
    tls: []
