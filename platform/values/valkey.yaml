fullnameOverride: valkey

# Chart valkey-0.9.4 defaults to appVersion 9.0.2; pin the latest 9.0.x
# patch for security fixes without moving the chart.
image:
  tag: "9.0.6"

replica:
  enabled: false

auth:
  enabled: false

dataStorage:
  enabled: false

service:
  type: ClusterIP
  port: 6379

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

networkPolicy: {}
