fullnameOverride: valkey

replica:
  enabled: false

auth:
  enabled: false

# The ledger is ephemeral demo state: emptyDir. (valkey-helm 1.0 renames
# this block to `persistence` and refuses to render while dataStorage is set.)
dataStorage:
  enabled: false

service:
  type: ClusterIP
  port: 6379

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

networkPolicy: {}
